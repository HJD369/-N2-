                displayWords();
            } catch (error) {
                console.error('加载词汇数据失败:', error);
                console.error('错误堆栈:', error.stack);
                const errorMsg = `无法加载词汇数据: ${error.message}`;
                const wordListEl = document.getElementById('word-list');
                if (wordListEl) {
                    wordListEl.innerHTML = `<p style="text-align: center; color: red; padding: 20px;">${errorMsg}</p>`;
                }
            }
        }

        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'study') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('study-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('test-section').classList.add('active');
                if (testWords.length === 0) {
                    startTest();
                }
            }
        }


        // 显示单词
        function displayWords() {
            console.log('显示单词，当前页:', currentPage, '总词汇数:', vocabularyData.length);
            const startIndex = (currentPage - 1) * wordsPerPage;
            const endIndex = Math.min(startIndex + wordsPerPage, vocabularyData.length);
            const pageWords = vocabularyData.slice(startIndex, endIndex);
            
            console.log('本页单词数:', pageWords.length);

            if (pageWords.length === 0) {
                document.getElementById('word-list').innerHTML = '<p style="text-align: center; padding: 20px; color: #888;">该范围内暂无单词数据</p>';
                return;
            }

            const wordListHtml = pageWords.map(word => {
                if (!word) {
                    console.error('发现空单词对象');
                    return '';
                }
                return `
                <div class="word-card">
                    <div class="word-japanese">${escapeHtml(word.word || '')}</div>
                    <div class="word-reading">${escapeHtml(word.reading || '')}</div>
                    <div class="word-meaning">${escapeHtml(word.meaning || '')}</div>
                    ${word.example ? `
                        <div class="word-example">
                            <div class="word-example-jp">${escapeHtml(word.example)}</div>
                            <div class="word-example-cn">${escapeHtml(word.exampleMeaning || '')}</div>
                        </div>
                    ` : ''}
                </div>
            `;
            }).join('');

            document.getElementById('word-list').innerHTML = wordListHtml;
            
            // 更新分页信息
            const totalPages = Math.ceil(vocabularyData.length / wordsPerPage);
            document.getElementById('page-info').textContent = `第 ${currentPage} 页，共 ${totalPages} 页`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages || totalPages === 0;
        }
        
        // HTML转义函数
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // HTML解码函数
        function decodeHtml(html) {
            if (!html) return '';
            const div = document.createElement('div');
            div.innerHTML = html;
            return div.textContent || div.innerText || '';
        }

        // 上一页
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                displayWords();
            }
        }

        // 下一页
        function nextPage() {
            const totalPages = Math.ceil(vocabularyData.length / wordsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayWords();
            }
        }

        // 开始测试
        function startTest() {
            console.log('开始测试，词汇数据长度:', vocabularyData.length);
            
            if (vocabularyData.length === 0) {
                document.getElementById('test-content').innerHTML = '<p style="text-align: center; padding: 40px; color: red; font-size: 1.2em;">词汇数据未加载，请先等待数据加载完成</p>';
                return;
            }

            // 随机选择30个单词进行测试
            const shuffled = [...vocabularyData].sort(() => Math.random() - 0.5);
            testWords = shuffled.slice(0, Math.min(30, shuffled.length));
            currentTestIndex = 0;
            testScore = { correct: 0, wrong: 0 };
            selectedAnswer = null;
            
            console.log('测试单词数:', testWords.length);
            document.getElementById('test-result').classList.add('hidden');
            showQuestion();
        }

        // 显示问题
        function showQuestion() {
            if (currentTestIndex >= testWords.length) {
                showTestResult();
                return;
            }

            const word = testWords[currentTestIndex];
            document.getElementById('test-word').textContent = word.word;
            document.getElementById('test-reading').textContent = word.reading;
            document.getElementById('test-info').textContent = `题目 ${currentTestIndex + 1} / ${testWords.length}`;
            document.getElementById('next-question-btn').style.display = 'none';

            // 生成选项（正确答案 + 3个随机错误答案）
            const allMeanings = vocabularyData.map(w => w.meaning).filter(m => m !== word.meaning);
            const wrongOptions = [...allMeanings].sort(() => Math.random() - 0.5).slice(0, 3);
            const options = [word.meaning, ...wrongOptions].sort(() => Math.random() - 0.5);

            // 使用data属性安全地存储答案，避免引号问题
            const optionsHtml = options.map((option, index) => {
                const escapedOption = escapeHtml(option);
                return `
                <div class="test-option" data-answer="${escapedOption.replace(/"/g, '&quot;')}" data-index="${index}">
                    ${escapedOption}
                </div>
            `;
            }).join('');

            document.getElementById('test-options').innerHTML = optionsHtml;
            
            // 为每个选项添加点击事件
            document.querySelectorAll('.test-option').forEach(optionEl => {
                optionEl.addEventListener('click', function() {
                    const answer = this.getAttribute('data-answer');
                    const index = parseInt(this.getAttribute('data-index'));
                    selectOption(index, answer);
                });
            });
            
            selectedAnswer = null;
        }

        // 选择答案
        function selectOption(index, answer) {
            if (selectedAnswer !== null) return;

            selectedAnswer = answer;
            const word = testWords[currentTestIndex];
            // 使用解码后的答案进行比较
            const decodedAnswer = decodeHtml(answer);
            const isCorrect = decodedAnswer === word.meaning;

            if (isCorrect) {
                testScore.correct++;
            } else {
                testScore.wrong++;
            }

            // 显示正确答案和错误答案
            document.querySelectorAll('.test-option').forEach((option, optIndex) => {
                option.classList.add('disabled');
                const optionText = option.textContent.trim();
                if (optionText === word.meaning) {
                    option.classList.add('correct');
                } else if (optIndex === index && !isCorrect) {
                    option.classList.add('wrong');
                }
            });

            document.getElementById('next-question-btn').style.display = 'block';
        }

        // 下一题
        function nextQuestion() {
            currentTestIndex++;
            showQuestion();
        }

        // 显示测试结果
        function showTestResult() {
            document.getElementById('test-question').style.display = 'none';
            document.getElementById('test-options').style.display = 'none';
            document.getElementById('test-info').style.display = 'none';
            document.getElementById('next-question-btn').style.display = 'none';
            
            const total = testScore.correct + testScore.wrong;
            const accuracy = total > 0 ? Math.round((testScore.correct / total) * 100) : 0;
            
            document.getElementById('test-score').textContent = `${testScore.correct} / ${total}`;
            document.getElementById('correct-count').textContent = testScore.correct;
            document.getElementById('wrong-count').textContent = testScore.wrong;
            document.getElementById('accuracy').textContent = `${accuracy}%`;
            
            document.getElementById('test-result').classList.remove('hidden');
        }

        // 重新开始测试
        function restartTest() {
            document.getElementById('test-question').style.display = 'block';
            document.getElementById('test-options').style.display = 'grid';
            document.getElementById('test-info').style.display = 'block';
            startTest();
        }

        // 页面加载时初始化
        // 使用 window.onload 确保所有资源（包括大数据数组）都已解析完成
        window.addEventListener('load', function() {
            console.log('页面完全加载完成，开始加载词汇数据');
            // 稍微延迟一下，确保数据数组已完全解析
            setTimeout(function() {
                try {
                    console.log('尝试访问 EMBEDDED_N2_DATA...');
                    if (typeof EMBEDDED_N2_DATA !== 'undefined') {
                        console.log('EMBEDDED_N2_DATA 已定义，长度:', EMBEDDED_N2_DATA.length);
                        loadVocabulary();
                    } else {
                        console.error('EMBEDDED_N2_DATA 未定义！');
                        document.getElementById('word-list').innerHTML = '<p style="text-align: center; color: red; padding: 20px;">数据加载失败：EMBEDDED_N2_DATA 未定义</p>';
                    }
                } catch (error) {
                    console.error('初始化错误:', error);
                }
            }, 100);
        });
        
        // 如果 window.onload 已经触发，立即执行
        if (document.readyState === 'complete') {
            console.log('页面已完全加载，立即执行');
            setTimeout(function() {
                if (typeof EMBEDDED_N2_DATA !== 'undefined') {
                    loadVocabulary();
                }
            }, 100);
        }
    </script>
</body>
</html>
